<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>음악왕 PWA 아이콘 PNG 생성기 (192x192 / 512x512)</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 36px 16px; }
    .box { max-width: 560px; margin: 0 auto; background: #1e293b; border: 2px solid #38bdf8; border-radius: 20px; padding: 24px; }
    .row { display: flex; justify-content: center; gap: 16px; margin: 20px 0; flex-wrap: wrap; }
    canvas { border-radius: 20px; border: 3px solid #facc15; background: #38bdf8; }
    button { background: #facc15; color: #0f172a; border: none; border-radius: 12px; padding: 14px 24px; font-size: 16px; font-weight: 900; cursor: pointer; }
    button:hover { background: #fde047; }
    p { color: #cbd5e1; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h2>👑 음악왕 APK용 PNG 아이콘 생성기</h2>
    <p>PWABuilder에서 APK 빌드를 100% 통과하려면 PNG 아이콘 3개가 필요합니다.<br/>아래 버튼을 누르면 <strong>icon-192.png</strong>, <strong>icon-512.png</strong>, <strong>icon-maskable-512.png</strong> 3개가 자동 다운로드됩니다.<br/>다운로드된 3개 파일을 <code>음악왕/icons/</code> 폴더에 넣고 GitHub에 푸시하세요!</p>
    <div class="row">
      <div><canvas id="c512" width="512" height="512" style="width:140px;height:140px;"></canvas><br/><small>icon-512.png</small></div>
      <div><canvas id="cmask" width="512" height="512" style="width:140px;height:140px;"></canvas><br/><small>icon-maskable-512.png</small></div>
      <div><canvas id="c192" width="192" height="192" style="width:140px;height:140px;"></canvas><br/><small>icon-192.png</small></div>
    </div>
    <button onclick="downloadAll()">⬇️ PNG 아이콘 3개 한번에 다운로드</button>
  </div>

  <script>
    function drawIcon(canvas, isMaskable) {
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const s = W / 512;
      ctx.save();
      ctx.scale(s, s);

      const bg = ctx.createLinearGradient(0, 0, 0, 512);
      bg.addColorStop(0, "#38bdf8");
      bg.addColorStop(1, "#2563eb");
      ctx.fillStyle = bg;
      if (isMaskable) {
        ctx.fillRect(0, 0, 512, 512);
      } else {
        ctx.beginPath();
        ctx.roundRect(0, 0, 512, 512, 110);
        ctx.fill();
      }

      if (isMaskable) {
        ctx.translate(256, 256);
        ctx.scale(0.76, 0.76);
        ctx.translate(-256, -256);
      }

      ctx.fillStyle = "rgba(255,255,255,0.16)";
      ctx.beginPath();
      ctx.arc(256, 256, 195, 0, Math.PI * 2);
      ctx.fill();

      // 왕관
      const gold = ctx.createLinearGradient(0, 120, 0, 360);
      gold.addColorStop(0, "#fef08a");
      gold.addColorStop(0.5, "#facc15");
      gold.addColorStop(1, "#d97706");

      ctx.fillStyle = gold;
      ctx.strokeStyle = "#1e1b18";
      ctx.lineWidth = 18;
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(126, 320);
      ctx.lineTo(106, 168);
      ctx.lineTo(186, 226);
      ctx.lineTo(256, 122);
      ctx.lineTo(326, 226);
      ctx.lineTo(406, 168);
      ctx.lineTo(386, 320);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#f59e0b";
      ctx.beginPath();
      ctx.roundRect(122, 320, 268, 44, 14);
      ctx.fill();
      ctx.stroke();

      // 보석
      ctx.fillStyle = "#ef4444";
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(256, 245, 24, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#38bdf8";
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(176, 264, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(336, 264, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      // 음표 배지
      ctx.fillStyle = "#1e1b4b";
      ctx.lineWidth = 14;
      ctx.beginPath(); ctx.arc(378, 368, 64, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fde047";
      ctx.font = "900 72px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("♪", 378, 372);

      ctx.restore();
    }

    drawIcon(document.getElementById("c512"), false);
    drawIcon(document.getElementById("cmask"), true);
    drawIcon(document.getElementById("c192"), false);

    function dl(id, name) {
      const a = document.createElement("a");
      a.download = name;
      a.href = document.getElementById(id).toDataURL("image/png");
      a.click();
    }

    function downloadAll() {
      dl("c512", "icon-512.png");
      setTimeout(() => dl("cmask", "icon-maskable-512.png"), 300);
      setTimeout(() => dl("c192", "icon-192.png"), 600);
    }
  </script>
</body>
</html>
